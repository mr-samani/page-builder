<div class="pb-inner" ngxDropListGroup>
  @if (viewMode == 'PrintPage') {
    <div class="title">Header</div>
    <ng-container
      *ngTemplateOutlet="treeLayout; context: { $implicit: currentPageHeaderItems, isOpen: true }"></ng-container>

    <div class="title">Body</div>
    <ng-container
      *ngTemplateOutlet="treeLayout; context: { $implicit: currentPageBodyItems, isOpen: true }"></ng-container>

    <div class="title">Footer</div>
    <ng-container
      *ngTemplateOutlet="treeLayout; context: { $implicit: currentPageFooterItems, isOpen: true }"></ng-container>
  } @else {
    <ng-container
      *ngTemplateOutlet="treeLayout; context: { $implicit: currentPageBodyItems, isOpen: true }"></ng-container>
  }
</div>

<ng-template #treeLayout let-list let-isOpen="isOpen" let-parent="parent">
  <ul class="tree-list" [class.is-open]="isOpen" ngxDropList (drop)="onDrop($event, parent)" [data]="list">
    @for (item of list; track $index) {
      <li class="list-item" [class.active]="pb.activeEl() == item" ngxDraggable dragHandle=".drag-hanlde">
        <div>
          <span class="drag-hanlde">
            <svg Icon="assets/icons/grip-dots.svg"></svg>
          </span>
          @if (item.children && item.children.length > 0) {
            <button type="button" (click)="item.isOpen = !item.isOpen">
              @if (item.isOpen) {
                <svg Icon="assets/icons/chevron-down.svg"></svg>
              } @else {
                <svg Icon="assets/icons/chevron-right.svg"></svg>
              }
            </button>
          }
          <span (click)="onSelectBlock($event, item)">{{ item.tag || item.el?.tagName }}</span>
        </div>
        <ng-container
          *ngTemplateOutlet="
            treeLayout;
            context: { $implicit: item.children, isOpen: item.isOpen, parent: item }
          "></ng-container>
      </li>
    }
  </ul>
</ng-template>
