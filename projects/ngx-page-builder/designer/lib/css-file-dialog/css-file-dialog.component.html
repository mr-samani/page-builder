<div ngx-dialog-header [showCloseButton]="true">CSS Classes</div>
<div ngx-dialog-body>
  <tab-group [(selectedIndex)]="selectedTabIndex">
    @for (item of files; track $index) {
      <tab-item [title]="item.name" [active]="$index == 0">
        <css-classes-editor [(ngModel)]="item.data"></css-classes-editor>
      </tab-item>
    }
  </tab-group>
</div>
<div ngx-dialog-footer>
  selectedTabIndex={{ selectedTabIndex }}
  @if (enableAddCssFile) {
    <button mat-raised-button color="primary" (click)="addFile()" [disabled]="loading">Add file</button>
  }

  <button mat-raised-button color="primary" (click)="updateFile()" [disabled]="loading">Update</button>

  <button mat-raised-button color="accent" (click)="deleteFile()" [disabled]="loading">Delete</button>
</div>
