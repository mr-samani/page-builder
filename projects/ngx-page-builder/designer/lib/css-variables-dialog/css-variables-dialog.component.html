<div ngxDialogHeader [showCloseButton]="true">CSS Variables</div>
<div ngxDialogBody>
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Type</th>
        <th>Name</th>
        <th>Value</th>
      </tr>
    </thead>
    <tbody>
      @for (item of cssVars; track $index) {
        <tr>
          <td>
            <button class="pb-btn" (click)="remove($index)">
              <ngx-icon icon="trash" />
            </button>
          </td>
          <td>
            <div class="pb-input-group">
              <select name="type" [(ngModel)]="item.type">
                @for (t of typeList; track $index) {
                  <option [value]="t">{{ t | titlecase }}</option>
                }
              </select>
            </div>
          </td>
          <td>
            <div class="pb-input-group">
              <input type="text" name="name" [(ngModel)]="item.name" [pattern]="nameRegEx" #name="ngModel" />
            </div>
          </td>
          <td>
            @switch (item.type) {
              @case ('Color') {
                <div class="pb-input-group">
                  <input ngxInputColor name="value" [(ngModel)]="item.value" readonly />
                </div>
              }
              @case ('Gradient') {
                <div class="pb-input-group">
                  <input ngxInputGradient name="value" [(ngModel)]="item.value" readonly />
                </div>
              }

              @default {
                <div class="pb-input-group">
                  <input type="text" name="value" [(ngModel)]="item.value" />
                </div>
              }
            }
          </td>
        </tr>
        @if (name.hasError('pattern')) {
          <tr>
            <td></td>
            <td colspan="3">
              <small style="color: red">Invalid variable name! only a-Z not start with number</small>
            </td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
<div ngxDialogFooter [align]="'space-between'">
  <button class="pb-btn" (click)="save()">
    <ngx-icon icon="save" />
    Save
  </button>
  <button class="pb-btn" (click)="add()">
    <ngx-icon icon="plus" />
    Add New Variable
  </button>
</div>
