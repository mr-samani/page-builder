<div ngx-dialog-header [showCloseButton]="true">CSS Variables</div>
<div ngx-dialog-body>
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Type</th>
        <th>Name</th>
        <th>Value</th>
      </tr>
    </thead>
    <tbody>
      @for (item of pb.cssVariables; track $index) {
        <tr>
          <td>
            <button class="pb-btn" (click)="remove($index)">
              <svg Icon="assets/icons/trash.svg"></svg>
            </button>
          </td>
          <td>
            <div class="pi-group">
              <select name="type" [(ngModel)]="item.type">
                <option value="Color">Color</option>
                <option value="String">String</option>
              </select>
            </div>
          </td>
          <td>
            <div class="pi-group">
              <input type="text" name="name" [(ngModel)]="item.name" />
            </div>
          </td>
          <td>
            @switch (item.type) {
              @case ('Color') {
                <div class="pi-group">
                  <input ngxInputColor name="value" [(ngModel)]="item.value" readonly />
                </div>
              }
              @default {
                <div class="pi-group">
                  <input type="text" name="value" [(ngModel)]="item.value" />
                </div>
              }
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<div ngx-dialog-footer [align]="'space-between'">
  <button class="pb-btn" (click)="add()">
    <svg Icon="assets/icons/plus.svg"></svg>
    Add New Variable
  </button>
</div>
