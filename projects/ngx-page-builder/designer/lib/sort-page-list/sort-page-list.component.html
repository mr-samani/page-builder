<div ngxDialogHeader [showCloseButton]="true">Sort Pages</div>
<div ngxDialogBody>
  <p>Drag and drop to reorder pages</p>

  <div class="list-container" ngxDropList (drop)="onDrop($event)">
    @for (page of pageList; track $index) {
      <div class="list-item" ngxDraggable>#Page {{ page.order + 1 }}</div>
    }
  </div>
</div>
<div ngxDialogFooter>
  <button type="button" class="pb-btn" (click)="ok()">Ok</button>
  <button type="button" class="pb-btn" (click)="cancel()">Cancel</button>
</div>
