<div class="page-builder-container ngx-page-builder">
  <toolbar [customToolbarButtons]="customToolbarButtons"></toolbar>
  <div class="components" id="blockSourceList" ngxDropList [data]="pb.sources" [disableSort]="true">
    @if (showPlugins) {
    <div class="tool" (click)="viewPlugins()" title="Plugins">
      <svg Icon="assets/icons/layer-plus.svg"></svg>
    </div>
    } @for (item of pb.sources; track $index) {
    <div class="tool" ngxDraggable [title]="item.title">
      <svg [Icon]="item.icon"></svg>
    </div>
    }
  </div>
  <div class="page-container full-height" (click)="pb.deSelectBlock()" (scroll)="blockSelector.updatePosition()">
    <inner-content></inner-content>
    <block-selector #blockSelector />
  </div>

  <side-config class="side-config"></side-config>
</div>
