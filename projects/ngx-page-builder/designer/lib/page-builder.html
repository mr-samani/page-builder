<div
  class="page-builder-container ngx-page-builder"
  dir="ltr"
  ngxDropListGroup
  [style.--side-config-width.px]="sideConfigSize()"
  [style.--panel-width.px]="panelService.panelSize()">
  <toolbar [customToolbarButtons]="customToolbarButtons"></toolbar>
  <div class="components">
    <button
      type="button"
      class="tool"
      (click)="panelService.toggle('layout')"
      title="Layouts"
      aria-label="Layouts"
      [class.active]="panelService.activePanel() == 'layout' ">
      <ngx-icon icon="layout" />
    </button>
    <button
      type="button"
      class="tool"
      (click)="panelService.toggle('block-library')"
      title="Blocks"
      aria-label="Blocks"
      [class.active]="panelService.activePanel() == 'block-library'">
      <ngx-icon icon="blocks" />
    </button>

    @if (showPlugins) {
    <button
      type="button"
      class="tool"
      title="Plugins"
      aria-label="Plugins"
      (click)="panelService.toggle('plugins')"
      [class.active]="panelService.activePanel() == 'plugins'">
      <ngx-icon icon="hexagon-plus" />
    </button>
    }

    <div class="space"></div>

    @if (toolbarConfig?.showConfigButton) {
    <button type="button" class="tool" title="Settings" aria-label="Settings" (click)="openConfigDialog()">
      <ngx-icon icon="cog" />
    </button>
    }
  </div>
  <div class="pb-panel-container">
    <ng-container [ngComponentOutlet]="panelService.panelComponent()"></ng-container>
  </div>
  <div class="page-container" (click)="pb.deSelectBlock()">
    <inner-content #innerContent></inner-content>
  </div>

  <div
    class="side-config"
    ngxResizable
    [minWidth]="200"
    [maxWidth]="800"
    [directions]="['w']"
    (resizeMove)="onResizeSideConfig($event)">
    <side-config></side-config>
    <div class="ngx-resize-handler" ngxResizeHandle="end"></div>
  </div>

  <!-- loading -->
  @if(isLoading()){
  <div class="ngx-page-builder-loading">loading...</div>
  }
</div>
