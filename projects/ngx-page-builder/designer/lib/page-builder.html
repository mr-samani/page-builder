<div class="page-builder-container ngx-page-builder" dir="ltr" ngxDropListGroup>
  <toolbar [customToolbarButtons]="customToolbarButtons"></toolbar>
  <div class="components" id="blockSourceList" ngxDropList [data]="pb.sources" [disableSort]="false">
    <div class="tool" (click)="toggleLayoutPanel()" title="Layouts" [class.active]="openLayout()">
      <svg Icon="assets/icons/layout.svg"></svg>
    </div>

    @if (showPlugins) {
    <div class="tool" (click)="viewPlugins()" title="Plugins">
      <svg Icon="assets/icons/hexagon-plus.svg"></svg>
    </div>
    } @for (item of pb.sources; track $index) {
    <div class="tool" ngxDraggable [title]="item.title" (dblclick)="addItem(item)">
      <svg [Icon]="item.icon"></svg>
    </div>
    }
  </div>
  <div class="page-container" (click)="pb.deSelectBlock()">
    <inner-content></inner-content>
  </div>

  <side-config class="side-config"></side-config>

  @if(openLayout()){
  <div class="pb-panel">
    <div class="pb-panel-header">
      <span>Layouts</span>
      <button type="button" (click)="toggleLayoutPanel()" class="pb-btn">
        <svg Icon="assets/icons/xmark.svg"></svg>
      </button>
    </div>
    <block-layouts></block-layouts>
  </div>
  } @if(isLoading()){
  <div class="ngx-page-builder-loading">loading...</div>
  }
</div>
