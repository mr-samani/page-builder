<div ngx-dialog-header [showCloseButton]="true">Export Plugin</div>
<div ngx-dialog-body>
  <div class="screenshot-container">
    @if (img) {
      <img [src]="img" alt="" class="screenshot" />
    }
  </div>
  <div class="loading-container">
    <loading [loading]="loading"></loading>
  </div>

  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input
      matInput
      id="name"
      name="name"
      [(ngModel)]="name"
      #nameInput="ngModel"
      required
      (keydown.enter)="ok($event)" />
    @if (nameInput.hasError('required')) {
      <mat-error class="text-danger">Name is required for plugin</mat-error>
    }
  </mat-form-field>
</div>
<div ngx-dialog-footer>
  <button matButton (click)="ok()" color="primary">Ok</button>
</div>
