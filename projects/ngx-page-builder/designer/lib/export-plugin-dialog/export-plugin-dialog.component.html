<div class="ngx-mat-dialog-header" mat-dialog-title>
  <span>Export Plugin</span>
  <button mat-dialog-close>X</button>
</div>
<mat-dialog-content>
  <div class="screenshot-container">
    @if (img) {
      <img [src]="img" alt="" class="screenshot" />
    }
  </div>
  <div class="loading-container">
    <loading [loading]="loading"></loading>
  </div>

  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input
      matInput
      id="name"
      name="name"
      [(ngModel)]="name"
      #nameInput="ngModel"
      required
      (keydown.enter)="ok($event)" />
    @if (nameInput.hasError('required')) {
      <mat-error class="text-danger">Name is required for plugin</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton (click)="ok()" color="primary">Ok</button>
</mat-dialog-actions>
