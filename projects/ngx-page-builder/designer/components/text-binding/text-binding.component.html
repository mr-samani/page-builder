@if (canBind()) {
  <div class="binding">
    <switch [ngModel]="bound()" (ngModelChange)="toggleBinding($event)" name="useBinding">
      {{ switchLabel }}
    </switch>

    @if (bound()) {
      <data-source-selector
        [scope]="scope()"
        [collectionId]="collectionId()"
        [path]="binding()"
        (pathChange)="onPathChange($event)"></data-source-selector>
    }
  </div>
}

@if (!bound() && !isImage) {
  <div class="text" (click)="openTextEditor()">
    <span [innerHTML]="item().content | safeHtml" class="content"></span>
    <ngx-icon icon="edit" width="25px" />
  </div>
}

@if (!bound() && isImage) {
  <button type="button" (click)="onChangeSrcImage()" class="pb-btn">Change Image</button>
}
