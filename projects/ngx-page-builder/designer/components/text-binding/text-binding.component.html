@if (parentCollection) {
  <div class="binding">
    <switch [ngModel]="mode === 'collection'" (ngModelChange)="toggleMode('collection', $event)" name="useCollection">
      {{ isImage ? 'Get image from collection' : 'Get text from collection' }}
    </switch>

    @if (mode === 'collection') {
      <data-source-selector
        [item]="item()"
        [collection]="true"
        placeholder="Select a field…"
        (pathChange)="onCollectionFieldChange($event)"></data-source-selector>
    }
  </div>
}

@if (!isImage) {
  <div class="binding">
    <switch [ngModel]="mode === 'object'" (ngModelChange)="toggleMode('object', $event)" name="useDynamicData">
      Binding to dynamic data
    </switch>

    @if (mode === 'object') {
      <data-source-selector
        [item]="item()"
        [collection]="false"
        placeholder="Select a data source…"></data-source-selector>
    }
  </div>
}

@if (mode === 'static' && !isImage) {
  <div class="text" (click)="openTextEditor()">
    <span [innerHTML]="item().content | safeHtml" class="content"></span>
    <ngx-icon icon="edit" width="25px" />
  </div>
}

@if (isImage && mode !== 'collection') {
  <button type="button" (click)="onChangeSrcImage()" class="pb-btn">Change Image</button>
}
