@for (level of levels(); track level.depth) {
  <div class="pb-input-group pi-row">
    <select [name]="'binding-level-' + level.depth" (change)="onSelect(level.depth, $event)">
      <option value="" [selected]="!level.selected">{{ emptyLabel(level.depth) }}</option>

      @for (option of level.options; track option.name) {
        <option [value]="option.name" [selected]="option.name === level.selected">
          {{ label(option) }}
        </option>
      }
    </select>
  </div>
} @empty {
  <p class="hint">There is no field to bind to.</p>
}
