@for (level of levels(); track $index) {
  <div class="pb-input-group pi-row">
    <select [name]="'ds-level-' + $index" (change)="onSelect($index, $event)">
      <option value="" [selected]="!level.selected">{{ $index === 0 ? placeholder() : '—' }}</option>
      @for (field of level.options; track field.name) {
        <option [value]="field.name" [selected]="field.name === level.selected">
          {{ field.displayName || field.name }}
        </option>
      }
    </select>
  </div>
}
