@if (item) {
  <div
    class="block-selector"
    [style.left.px]="x"
    [style.top.px]="y"
    [style.width.px]="width"
    [style.height.px]="height">
    <div class="actions" [class.bottom]="showInBottom">
      <!-- @if (!item.disableMovement) {
        <span type="button" dragHandle>
          <ngx-icon icon="grip-dots" />
        </span>
      } -->

      @if (item.parent) {
        <button type="button" (click)="selectParent($event)" title="Parent">
          <ngx-icon icon="arrowTurnUp" />
        </button>
      }

      @if (!item.disableDelete) {
        <button type="button" (click)="deleteBlock()" title="Delete">
          <ngx-icon icon="trash" />
        </button>
      }

      <span class="tag">{{ item.tag ? (item.tag | uppercase) : item.customComponent?.componentKey }}</span>
      <!-- <span class="id">{{ item.id }}</span> -->
    </div>
  </div>
}
