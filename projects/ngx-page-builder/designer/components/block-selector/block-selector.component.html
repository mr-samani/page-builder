<!-- این سه المان همیشه در DOM هستند و فقط مقدار style آن‌ها از TS عوض می‌شود -->
<div class="spacing margin" #margin></div>
<div class="spacing padding" #padding></div>

<div class="block-selector" #frame>
  @if (item) {
    <div class="actions" (pointerdown)="$event.stopPropagation()">
      @if (item.parent) {
        <button type="button" (click)="selectParent($event)" title="Parent">
          <ngx-icon icon="arrow-turn-up" />
        </button>
      }

      @if (!item.disableDelete) {
        <button type="button" (click)="deleteBlock()" title="Delete">
          <ngx-icon icon="trash" />
        </button>
      }
      <span class="tag">{{ item.tag ? (item.tag | uppercase) : item.customComponent?.componentKey }}</span>
    </div>
  }
</div>
