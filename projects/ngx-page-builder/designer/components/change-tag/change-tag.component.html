<div class="tag-container">
  <div class="tag">Tag: {{ item.tag }}</div>
  @if (canChangeTag) {
    <div class="pi-group pi-row">
      <select name="select-tag" [(ngModel)]="item.tag" (change)="onChangeTag($event)">
        <option value="" disabled>Select a page…</option>
        @for (t of tagList; track $index) {
          <option [value]="t">{{ t }}</option>
        }
      </select>
    </div>
  }
</div>
