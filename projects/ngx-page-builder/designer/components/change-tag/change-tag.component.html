<div class="tag-container">
  <span>Tag:</span>
  @if (canChangeTag) {
    <div class="pb-input-group pi-row">
      <select name="select-tag" [(ngModel)]="item.tag" (change)="onChangeTag($event)">
        <option value="" disabled>Select a page…</option>
        @for (t of tagList; track $index) {
          <option [value]="t">{{ t }}</option>
        }
      </select>
    </div>
  } @else {
    <span>{{ item.tag }}</span>
  }
</div>
