<div class="pb-inner">
  @if (item) {
    <div class="tag">{{ item.tag }}</div>
    <!-- <div class="id">{{ item.id }}</div> -->

    @if (item.CanBeSetContent || item.isImageTag) {
      <text-binding [item]="item" [parentCollection]="parentCollection" (change)="onChangeProperties()"></text-binding>
    }

    @if (item.customComponent && settingComponent) {
      <ng-container
        [ngComponentOutlet]="settingComponent"
        [ngComponentOutletInjector]="item.customComponent.compInjector"></ng-container>
    } @else if (sourceSettings.length) {
      <generic-block-settings [item]="item" [fields]="sourceSettings"></generic-block-settings>
    }

    @if (item.isLink) {
      <edit-link [item]="item" [parentCollection]="parentCollection" [collectionFields]="collectionFields"></edit-link>
    }
    @if (enableExportAsPlugin) {
      <div class="export-as-plugin">
        <button type="button" class="pb-btn" (click)="exportBlockAsPlugin()">Export as plugin</button>
      </div>
    }
  }
</div>
