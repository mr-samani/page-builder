<div ngxDialogHeader [showCloseButton]="true">Save as Snippet</div>
<div ngxDialogBody>
  <div class="pb-form-field">
    <label for="name">Name</label>
    <input id="name" name="name" [(ngModel)]="name" #nameInput="ngModel" required (keydown.enter)="ok($event)" />
    @if (nameInput.hasError('required')) {
      <p class="text-danger">Name is required for snippet</p>
    }
  </div>

  <div class="screenshot-container">
    @if (img) {
      <img [src]="img" alt="" class="screenshot" />
    }
  </div>
  <div class="loading-container">
    <loading [loading]="loading"></loading>
  </div>
</div>
<div ngxDialogFooter>
  <button type="button" class="pb-btn" (click)="ok()">Ok</button>
</div>
