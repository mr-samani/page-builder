<div ngxDialogHeader [showCloseButton]="true">CSS Classes</div>
<div ngxDialogBody>
  <tab-group [(selectedIndex)]="selectedTabIndex">
    @for (item of files; track $index) {
      <tab-item [title]="item.name" [active]="$index == selectedTabIndex">
        <!-- <pre>{{ item.data | json }}</pre> -->
        <css-classes-editor [(ngModel)]="item.data"></css-classes-editor>
      </tab-item>
    }
  </tab-group>
</div>
<div ngxDialogFooter>
  @if (enableAddCssFile) {
    <button type="button" class="pb-btn" (click)="addFile()" [disabled]="loading">Add file</button>
  }

  <button type="button" class="pb-btn" (click)="updateFile()" [disabled]="loading">Update</button>

  <button type="button" class="pb-btn" (click)="deleteFile()" [disabled]="loading">Delete</button>
</div>
