<div class="flex-row" #colContainer></div>
@if (editMode) {
  <div class="action-container">
    <button (click)="addColumnToFirst()" type="button" class="btn-add-column">
      <ngx-icon icon="plus" />
    </button>
    <button (click)="addColumnToLast()" type="button" class="btn-add-column">
      <ngx-icon icon="plus" />
    </button>
  </div>
}
